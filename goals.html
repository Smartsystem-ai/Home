<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأهداف المالية</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page">
  <div class="page-head"><div><h1>الأهداف المالية</h1><p class="muted">حوّل أي فكرة لخطة: موبايل، سفر، مشروع، مقدم شقة، صندوق طوارئ.</p></div><a class="btn primary" href="ai.html">ناقش الهدف مع المستشار</a></div>
  <section class="grid-2">
    <div class="card top-line"><h3>إضافة / تعديل هدف</h3><form id="goalForm" onsubmit="event.preventDefault(); saveGoalForm()"><input type="hidden" id="id" name="id"><label>اسم الهدف</label><input id="title" name="title" placeholder="مثال: موبايل جديد"><label>المبلغ المطلوب</label><input id="target_amount" name="target_amount" type="number"><label>المبلغ المتحوش حاليًا</label><input id="saved_amount" name="saved_amount" type="number"><label>المدة بالشهور</label><input id="deadline_months" name="deadline_months" type="number" value="3"><label>الأولوية</label><select id="priority" name="priority"><option value="high">عالي</option><option value="medium" selected>متوسط</option><option value="low">منخفض</option></select><label>ملاحظات</label><textarea id="note" name="note"></textarea><button class="btn primary wide">حفظ الهدف</button></form></div>
    <div class="card top-line"><h3>اقتراح ذكي</h3><div id="advisor" class="result-box">جاري التحليل...</div><div class="actions"><button class="btn secondary" onclick="quickGoal('عايز اعمل صندوق طوارئ')">صندوق طوارئ</button><button class="btn secondary" onclick="quickGoal('عايز اسدد ديوني')">سداد ديون</button></div></div>
  </section>
  <section class="card" style="margin-top:16px"><h3>أهدافك</h3><div id="goalsList" class="grid-2"></div></section>
</main>
<script>mountNav();let H;load();async function load(){H=await getHousehold();const s=await financeSummary(H);advisor.textContent=await ideaSavingChat(H,'');const {data,error}=await window.sb.from('goals').select('*').eq('household_id',H.id).order('created_at',{ascending:false});if(error){toast(error.message,'bad');return}window._goals=data||[];goalsList.innerHTML=window._goals.map(g=>{const pct=g.target_amount?Math.min(100,Math.round((Number(g.saved_amount||0)/Number(g.target_amount))*100)):0;const need=Math.max(0,Number(g.target_amount)-Number(g.saved_amount||0));const monthly=Math.ceil(need/Math.max(1,Number(g.deadline_months||1)));const ok=s.remaining>=monthly;return `<div class="plan-card"><h3>${escapeHtml(g.title)}</h3><p class="muted">المطلوب شهريًا: ${fmt(monthly)} — ${ok?'مناسب':'محتاج ضغط'}</p><div class="goal-progress"><span style="width:${pct}%"></span></div><p>${fmt(g.saved_amount)} / ${fmt(g.target_amount)} (${pct}%)</p><div class="actions"><button class="btn" onclick="editGoal('${g.id}')">تعديل</button><button class="btn danger" onclick="deleteRow('goals','${g.id}')">حذف</button></div></div>`}).join('')||'<p class="empty">لا توجد أهداف بعد.</p>'}
function editGoal(gid){const g=(window._goals||[]).find(x=>x.id===gid); if(g) fillForm('#goalForm',g)}
async function saveGoalForm(){try{await saveGoal(H,{id:id.value,title:title.value,target_amount:target_amount.value,saved_amount:saved_amount.value,deadline_months:deadline_months.value,priority:priority.value,note:note.value});goalForm.reset();id.value='';load()}catch(e){toast(e.message,'bad')}}
function quickGoal(t){location.href='ai.html?ask='+encodeURIComponent(t)}</script></body></html>
