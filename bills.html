<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفواتير</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script><main class="container page"><h1>الفواتير</h1><section class="card top-line"><input id="id" type="hidden"><div class="row"><div><label>اسم الفاتورة</label><input id="bill_name" placeholder="كهرباء"></div><div><label>المبلغ</label><input id="amount" type="number"></div><div><label>تاريخ الاستحقاق</label><input id="due_date" type="date"></div><div><label>الحالة</label><select id="status"><option value="unpaid">غير مدفوعة</option><option value="paid">مدفوعة</option><option value="late">متأخرة</option></select></div></div><div class="actions"><button class="btn primary" onclick="save()">حفظ</button><button class="btn" onclick="resetForm()">جديد</button></div></section><section class="card" style="margin-top:14px"><table><thead><tr><th>الفاتورة</th><th>المبلغ</th><th>الاستحقاق</th><th>الحالة</th><th>تحكم</th></tr></thead><tbody id="list"></tbody></table></section></main><script>mountNav();let H,rows=[];load();async function load(){H=await getHousehold(); if(!H) return; const {data,error}=await window.sb.from('bills').select('*').eq('household_id',H.id).order('due_date'); if(error)return toast(error.message,'bad'); rows=data||[];list.innerHTML=rows.map(x=>`<tr><td>${escapeHtml(x.bill_name)}</td><td>${fmt(x.amount)}</td><td>${x.due_date||'-'}</td><td><span class="pill ${x.status==='late'?'warn':''}">${x.status}</span></td><td><div class="actions"><button class="btn mini edit" onclick="edit('${x.id}')">تعديل</button><button class="btn mini" onclick="markPaid('${x.id}')">تم الدفع</button><button class="btn mini delete" onclick="deleteRow('bills','${x.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td class="empty" colspan="5">لا توجد فواتير</td></tr>'}function resetForm(){id.value='';bill_name.value='';amount.value='';due_date.value='';status.value='unpaid'}function edit(rid){const x=rows.find(r=>r.id===rid); if(!x)return; id.value=x.id;bill_name.value=x.bill_name;amount.value=x.amount;due_date.value=x.due_date||'';status.value=x.status;scrollTo({top:0,behavior:'smooth'})}async function markPaid(rid){const {error}=await window.sb.from('bills').update({status:'paid'}).eq('id',rid); if(error)return toast(error.message,'bad');toast('تم تعليم الفاتورة كمدفوعة');load()}async function save(){try{const payload={household_id:H.id,created_by:H.user.id,bill_name:bill_name.value||'فاتورة',amount:num(amount.value),due_date:due_date.value||null,status:status.value}; if(!payload.amount) throw new Error('اكتب المبلغ'); await saveGeneric('bills',payload,id.value); resetForm(); load();}catch(e){toast(e.message,'bad')}}</script></body></html>
