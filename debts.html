<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الديون والسلف</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script><main class="container page"><h1>الديون والسلف</h1><section class="card top-line"><input id="id" type="hidden"><div class="row-3"><input id="person_name" placeholder="اسم الشخص"><select id="direction"><option value="i_owe">أنا عليا فلوس</option><option value="owes_me">ليّا فلوس عنده</option></select><input id="amount" type="number" placeholder="المبلغ الكلي"><input id="paid_amount" type="number" placeholder="المدفوع"><input id="due_date" type="date"><select id="status"><option value="open">مفتوحة</option><option value="partial">جزئي</option><option value="paid">مدفوعة</option><option value="late">متأخرة</option></select></div><div class="actions"><button class="btn primary" onclick="save()">حفظ</button><button class="btn" onclick="resetForm()">جديد</button></div></section><section class="card" style="margin-top:14px"><table><thead><tr><th>الشخص</th><th>النوع</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>تحكم</th></tr></thead><tbody id="list"></tbody></table></section></main><script>mountNav();let H,rows=[];load();async function load(){H=await getHousehold();const {data,error}=await window.sb.from('debts').select('*').eq('household_id',H.id).order('created_at',{ascending:false}); if(error)return toast(error.message,'bad');rows=data||[];list.innerHTML=rows.map(x=>{const rem=Math.max(num(x.amount)-num(x.paid_amount),0);return `<tr><td>${escapeHtml(x.person_name)}</td><td>${x.direction==='i_owe'?'عليا':'ليا'}</td><td>${fmt(x.amount)}</td><td>${fmt(x.paid_amount)}</td><td>${fmt(rem)}</td><td>${x.status}</td><td><div class="actions"><button class="btn mini edit" onclick="edit('${x.id}')">تعديل</button><button class="btn mini" onclick="markPaid('${x.id}')">تم السداد</button><button class="btn mini delete" onclick="deleteRow('debts','${x.id}')">حذف</button></div></td></tr>`}).join('')||'<tr><td class="empty" colspan="7">لا توجد ديون أو سلف</td></tr>'}function resetForm(){id.value='';person_name.value='';direction.value='i_owe';amount.value='';paid_amount.value='';due_date.value='';status.value='open'}function edit(rid){const x=rows.find(r=>r.id===rid); if(!x)return; id.value=x.id;person_name.value=x.person_name;direction.value=x.direction;amount.value=x.amount;paid_amount.value=x.paid_amount;due_date.value=x.due_date||'';status.value=x.status;scrollTo({top:0,behavior:'smooth'})}async function markPaid(rid){const x=rows.find(r=>r.id===rid); if(!x)return; const {error}=await window.sb.from('debts').update({paid_amount:x.amount,status:'paid'}).eq('id',rid); if(error)return toast(error.message,'bad');toast('تم السداد');load()}async function save(){try{const payload={household_id:H.id,created_by:H.user.id,person_name:person_name.value||'غير محدد',direction:direction.value,amount:num(amount.value),paid_amount:num(paid_amount.value)||0,due_date:due_date.value||null,status:status.value}; if(!payload.amount) throw new Error('اكتب المبلغ'); await saveGeneric('debts',payload,id.value); resetForm(); load();}catch(e){toast(e.message,'bad')}}</script></body></html>
