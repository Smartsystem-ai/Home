<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>التحديات المالية</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page">
<div class="page-head"><div><h1>التحديات المالية</h1><p class="muted">حوّل التحويش للعبة: تحديات أسبوعية وشهرية تقيس التزامك.</p></div><a class="btn secondary" href="dashboard.html">الرئيسية</a></div>
<section class="grid-2"><div class="card top-line"><h3>تحدي جديد</h3><label>نوع التحدي</label><select id="type"><option value="no_luxury">أسبوع بدون كماليات</option><option value="save_amount">تحويش مبلغ محدد</option><option value="cut_category">تقليل بند صرف</option></select><label>المبلغ / الهدف</label><input id="target_amount" type="number" placeholder="مثال 1000"><label>ملاحظات</label><input id="note" placeholder="مثال: تقليل طلبات الأكل"><div class="actions"><button class="btn primary" onclick="addChallenge()">ابدأ التحدي</button></div></div><div class="card top-line"><h3>تحدياتك</h3><table><tbody id="rows"></tbody></table></div></section></main>
<script>mountNav(); let H; load(); async function load(){H=await getHousehold(); if(!H) return; const {data,error}=await window.sb.from('challenges').select('*').eq('household_id',H.id).order('created_at',{ascending:false}); if(error){rows.innerHTML='<tr><td class="empty">شغّل SQL المحدث لإضافة جدول التحديات.</td></tr>';return} rows.innerHTML=(data||[]).map(x=>`<tr><td>${x.type}</td><td>${fmt(x.target_amount)}</td><td>${escapeHtml(x.note||'')}</td><td><button class="btn mini" onclick="completeChallenge('${x.id}')">تم</button></td><td><button class="btn mini danger" onclick="deleteRow('challenges','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td class="empty">لا توجد تحديات.</td></tr>'} async function addChallenge(){try{const {error}=await window.sb.from('challenges').insert({household_id:H.id,created_by:H.user.id,type:type.value,target_amount:num(target_amount.value),note:note.value,status:'active'}); if(error) throw error; toast('بدأ التحدي'); load()}catch(e){toast(e.message,'bad')}} async function completeChallenge(id){const {error}=await window.sb.from('challenges').update({status:'done',completed_at:new Date().toISOString()}).eq('id',id); if(error) return toast(error.message,'bad'); toast('برافو، التحدي اتقفل'); load()}</script></body></html>
