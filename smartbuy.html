<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>هل أقدر أشتريها</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page">
<div class="page-head"><div><h1>هل أقدر أشتريها؟</h1><p class="muted">اكتب الحاجة وسعرها، والسيستم يحسب تأثيرها على مرتبك ومصاريفك وديونك.</p></div><a class="btn secondary" href="dashboard.html">الرئيسية</a></div>
<section class="grid-2">
<div class="card top-line"><h3>اختبار قرار شراء</h3><label>اسم الحاجة</label><input id="item" placeholder="مثال: موبايل جديد"><label>السعر</label><input id="amount" type="number" placeholder="20000"><label>خلال كام شهر لو هتحوش؟</label><input id="months" type="number" placeholder="5"><div class="actions"><button class="btn primary" onclick="checkBuy()">احسب القرار</button><button class="btn secondary" onclick="saveAsGoal()">حوّلها لهدف</button></div></div>
<div class="card top-line"><h3>القرار</h3><div id="decision" class="result-box">اكتب السعر واضغط احسب.</div></div>
</section></main>
<script>
mountNav(); let H; load();
async function load(){H=await getHousehold(); if(!H) return;}
async function checkBuy(){
  if(!H){decision.textContent='لم يتم تحميل بيانات البيت. اعمل Refresh.';return;}
  decision.textContent='جاري حساب القرار...';
  try{
    decision.textContent = await purchaseDecision(H,{name:item.value||'الشراء',price:amount.value,months:months.value});
  }catch(e){decision.textContent='خطأ: '+e.message;}
}
async function saveAsGoal(){
  const price=num(amount.value);
  if(!price) return toast('اكتب السعر','bad');
  try{
    await saveGoal(H,{title:item.value||'هدف شراء',target_amount:price,deadline_months:num(months.value)||1,priority:'medium'});
    location.href='goals.html';
  }catch(e){toast(e.message,'bad')}
}
</script></body></html>
