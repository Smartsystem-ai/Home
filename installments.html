<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأقساط</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script><main class="container page"><h1>الأقساط</h1><section class="card top-line"><input id="id" type="hidden"><div class="row-3"><input id="title" placeholder="اسم القسط"><input id="total_amount" type="number" placeholder="الإجمالي"><input id="monthly_amount" type="number" placeholder="القسط الشهري"><input id="total_months" type="number" placeholder="عدد الشهور"><input id="paid_months" type="number" placeholder="الشهور المدفوعة"><input id="next_due_date" type="date"><select id="status"><option value="active">نشط</option><option value="finished">منتهي</option><option value="late">متأخر</option></select></div><div class="actions"><button class="btn primary" onclick="save()">حفظ</button><button class="btn" onclick="resetForm()">جديد</button></div></section><section class="card" style="margin-top:14px"><table><thead><tr><th>الاسم</th><th>شهري</th><th>مدفوع</th><th>متبقي</th><th>القادم</th><th>تحكم</th></tr></thead><tbody id="list"></tbody></table></section></main><script>mountNav();let H,rows=[];load();async function load(){H=await getHousehold(); if(!H) return; const {data,error}=await window.sb.from('installments').select('*').eq('household_id',H.id).order('next_due_date'); if(error)return toast(error.message,'bad');rows=data||[];list.innerHTML=rows.map(x=>{const rem=Math.max((num(x.total_months)-num(x.paid_months))*num(x.monthly_amount),0);return `<tr><td>${escapeHtml(x.title)}</td><td>${fmt(x.monthly_amount)}</td><td>${x.paid_months}/${x.total_months}</td><td>${fmt(rem)}</td><td>${x.next_due_date||'-'}</td><td><div class="actions"><button class="btn mini edit" onclick="edit('${x.id}')">تعديل</button><button class="btn mini" onclick="payOne('${x.id}')">دفع شهر</button><button class="btn mini delete" onclick="deleteRow('installments','${x.id}')">حذف</button></div></td></tr>`}).join('')||'<tr><td class="empty" colspan="6">لا توجد أقساط</td></tr>'}function resetForm(){id.value='';title.value='';total_amount.value='';monthly_amount.value='';total_months.value='';paid_months.value='';next_due_date.value='';status.value='active'}function edit(rid){const x=rows.find(r=>r.id===rid); if(!x)return; id.value=x.id;title.value=x.title;total_amount.value=x.total_amount;monthly_amount.value=x.monthly_amount;total_months.value=x.total_months;paid_months.value=x.paid_months;next_due_date.value=x.next_due_date||'';status.value=x.status;scrollTo({top:0,behavior:'smooth'})}async function payOne(rid){const x=rows.find(r=>r.id===rid); if(!x)return; const paid=Math.min(num(x.paid_months)+1,num(x.total_months)); const st=paid>=num(x.total_months)?'finished':x.status; const {error}=await window.sb.from('installments').update({paid_months:paid,status:st}).eq('id',rid); if(error)return toast(error.message,'bad');toast('تم تسجيل دفع شهر');load()}async function save(){try{const payload={household_id:H.id,created_by:H.user.id,title:title.value||'قسط',total_amount:num(total_amount.value),monthly_amount:num(monthly_amount.value),total_months:num(total_months.value)||1,paid_months:num(paid_months.value)||0,next_due_date:next_due_date.value||null,status:status.value}; if(!payload.monthly_amount) throw new Error('اكتب القسط الشهري'); await saveGeneric('installments',payload,id.value); resetForm(); load();}catch(e){toast(e.message,'bad')}}</script></body></html>
