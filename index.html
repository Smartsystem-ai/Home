<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Masrofi Smart - Login</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<main class="auth"><section class="card auth-card">
  <div class="auth-logo"><span>م</span></div>
  <h1>مصروفي سمارت</h1><p class="muted">إدارة المصروفات المنزلية والمعيشة بذكاء وتحليل تلقائي</p>
  <div class="tabs"><button type="button" id="loginTab" class="active" onclick="showAuth('login')">دخول</button><button type="button" id="regTab" onclick="showAuth('reg')">حساب جديد</button></div>
  <div id="loginBox" class="form-panel"><label>الإيميل</label><input id="loginEmail" type="email" autocomplete="email" placeholder="name@email.com"><label>الباسورد</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" id="loginBtn" class="btn primary wide" onclick="login()">دخول</button></div>
  <div id="regBox" class="form-panel hidden"><label>الاسم</label><input id="regName" autocomplete="name"><label>اسم البيت</label><input id="houseName" placeholder="بيت أحمد"><label>الإيميل</label><input id="regEmail" type="email" autocomplete="email"><label>الباسورد</label><input id="regPass" type="password" autocomplete="new-password" placeholder="6 حروف على الأقل"><button type="button" id="regBtn" class="btn primary wide" onclick="register()">تسجيل</button></div>
  <p id="msg" class="status"></p>
</section></main>
<script src="js/config.js"></script><script>
const msg=document.getElementById('msg');
function setMsg(t,bad=false){msg.textContent=t||'';msg.className='status '+(bad?'bad':'')}
function showAuth(mode){loginBox.classList.toggle('hidden',mode!=='login');regBox.classList.toggle('hidden',mode!=='reg');loginTab.classList.toggle('active',mode==='login');regTab.classList.toggle('active',mode==='reg');setMsg('')}
function configured(){ if(!window.sb){const issues=(window.masrofiConfig?.issues||[]).join(' ');setMsg('راجع js/config.js: رابط Supabase لازم يكون Project URL بدون /rest/v1 ومعاه anon key.'+(issues?' '+issues:''),true);return false} return true; }
function normalizeRpcRow(data){return Array.isArray(data)?data[0]:data}
function nextPage(){const p=new URLSearchParams(location.search).get('returnTo')||'dashboard.html';return /^[a-z0-9_-]+\.html$/i.test(p)?p:'dashboard.html'}
async function ensureHousehold(fullName='مستخدم', home='بيتي'){
  const {data:{session}}=await window.sb.auth.getSession();
  if(!session) return false;
  try{
    const {data,error}=await window.sb.rpc('ensure_current_household');
    if(error) throw error;
    const row=normalizeRpcRow(data);
    if(!row || !row.household_id) throw new Error('ensure_current_household لم يرجع بيت للمستخدم.');
    return true;
  }catch(e){
    setMsg('تم الدخول لكن قاعدة البيانات مش متظبطة: '+e.message+'. شغّل ملف supabase/02_SAFE_AUTH_SESSION_FIX.sql أو ملف البناء الكامل لو دي قاعدة جديدة.',true);
    return false;
  }
}
window.addEventListener('load',async()=>{ if(!configured()) return; const {data:{session}}=await window.sb.auth.getSession(); if(session){ const ok=await ensureHousehold(); if(ok) location.href=nextPage(); }});
async function login(){
 if(!configured())return; setMsg('جاري الدخول...'); loginBtn.disabled=true;
 const {error}=await window.sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPass.value});
 loginBtn.disabled=false; if(error){setMsg('بيانات الدخول غير صحيحة أو الإيميل غير مؤكد. لو لسه عامل الحساب اقفل Confirm email من Supabase أو أكد الإيميل.',true);return}
 const ok=await ensureHousehold(); if(ok) location.href=nextPage();
}
async function register(){
 if(!configured())return; setMsg('جاري التسجيل...'); regBtn.disabled=true;
 const email=regEmail.value.trim(); const password=regPass.value; const fullName=regName.value.trim()||'مستخدم'; const home=houseName.value.trim()||'بيتي';
 if(!email||!password){regBtn.disabled=false;setMsg('اكتب الإيميل والباسورد.',true);return}
 const {data,error}=await window.sb.auth.signUp({email,password,options:{data:{full_name:fullName,house_name:home},emailRedirectTo:location.origin+location.pathname}});
 if(error){regBtn.disabled=false;setMsg(error.message,true);return}
 const {data:{session}}=await window.sb.auth.getSession();
 if(!session){regBtn.disabled=false;setMsg('تم إنشاء الحساب. لو Confirm email شغال لازم تأكد الإيميل، أو اقفله من Supabase Authentication > Providers > Email.',false);showAuth('login');return}
 const ok=await ensureHousehold(fullName,home); if(!ok){regBtn.disabled=false;return}
 location.href=nextPage()
}
</script></body></html>
