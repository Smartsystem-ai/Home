<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشيت</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page"><div class="page-head"><div><h1>الشيت الذكي</h1><p class="muted">إضافة، تعديل، حذف، وحساب تأثير كل عملية على المتبقي.</p></div><a class="btn secondary" href="dashboard.html">الملخص</a></div>
<section class="card top-line"><input type="hidden" id="id"><div class="row"><div><label>النوع</label><select id="type"><option value="expense">مصروف</option><option value="income">دخل</option></select></div><div><label>التصنيف</label><input id="category" placeholder="أكل، مرتب، مواصلات"></div><div><label>المبلغ</label><input id="amount" type="number"></div><div><label>التاريخ</label><input id="date" type="date"></div></div><label>ملاحظة</label><input id="note"><div class="actions"><button class="btn primary" onclick="saveTx()">حفظ العملية</button><button class="btn" onclick="resetForm()">جديد</button></div></section>
<section class="card" style="margin-top:14px"><h3>العمليات</h3><table><thead><tr><th>النوع</th><th>التصنيف</th><th>المبلغ</th><th>التاريخ</th><th>ملاحظة</th><th>تحكم</th></tr></thead><tbody id="list"></tbody></table></section></main>
<script>mountNav();date.value=todayISO();let H, rows=[];load();async function load(){H=await getHousehold();const {data,error}=await window.sb.from('transactions').select('*').eq('household_id',H.id).order('date',{ascending:false}); if(error)return toast(error.message,'bad'); rows=data||[];list.innerHTML=rows.map(x=>`<tr><td>${x.type==='income'?'دخل':'مصروف'}</td><td>${escapeHtml(x.category)}</td><td>${fmt(x.amount)}</td><td>${x.date}</td><td>${escapeHtml(x.note||'')}</td><td><div class="actions"><button class="btn mini edit" onclick="editTx('${x.id}')">تعديل</button><button class="btn mini delete" onclick="deleteRow('transactions','${x.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td class="empty" colspan="6">لا توجد عمليات</td></tr>'}function resetForm(){id.value='';type.value='expense';category.value='';amount.value='';note.value='';date.value=todayISO()}function editTx(rid){const x=rows.find(r=>r.id===rid); if(!x)return; id.value=x.id;type.value=x.type;category.value=x.category;amount.value=x.amount;date.value=x.date;note.value=x.note||'';scrollTo({top:0,behavior:'smooth'})}async function saveTx(){try{const status=H.role==='member'?'pending':'approved';const payload={household_id:H.id,created_by:H.user.id,assigned_to_member_id:H.member_id,type:type.value,category:category.value||'عام',amount:num(amount.value),note:note.value,date:date.value||todayISO(),status}; if(!payload.amount) throw new Error('اكتب المبلغ'); await saveGeneric('transactions',payload,id.value); resetForm(); load();}catch(e){toast(e.message,'bad')}}</script></body></html>
