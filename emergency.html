<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>خطة الطوارئ</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page">
<div class="page-head"><div><h1>خطة الطوارئ</h1><p class="muted">صندوق طوارئ تدريجي يحميك من العجز والديون المفاجئة.</p></div><a class="btn secondary" href="dashboard.html">الرئيسية</a></div>
<section class="grid-2"><div class="card top-line"><h3>إعداد الصندوق</h3><label>هدف الطوارئ النهائي</label><input id="target" type="number" placeholder="مثال 30000"><label>أقدر أحوش شهريًا</label><input id="monthly" type="number" placeholder="مثال 2000"><div class="actions"><button class="btn primary" onclick="calcEmergency()">احسب الخطة</button><button class="btn secondary" onclick="saveEmergency()">حفظ كهدف احتياطي</button></div></div><div class="card top-line"><h3>الخطة</h3><div id="out" class="result-box">حدد هدف الطوارئ.</div></div></section></main>
<script>mountNav(); let H; load(); async function load(){H=await getHousehold(); if(!H) return; const s=await getSettings(H); target.value=s.emergency_target||'';} async function calcEmergency(){const t=num(target.value); let m=num(monthly.value); const s=await financeSummary(H); if(!t){out.textContent='اكتب هدف الطوارئ النهائي.';return} if(!m) m=Math.max(0,Math.floor(s.remaining*0.25)); const months=Math.ceil(t/Math.max(m,1)); out.textContent=`هدف الطوارئ: ${fmt(t)}
المبلغ الشهري المقترح: ${fmt(m)}
المدة المتوقعة: ${months} شهر

اقتراح ذكي: ابدأ بـ ${fmt(Math.max(100,Math.floor(m/2)))} أول شهرين لو الالتزامات عالية، وبعدها زود المبلغ تدريجيًا.`} async function saveEmergency(){try{const s=await getSettings(H); await saveSettings(H,{monthly_salary:s.monthly_salary,salary_day:s.salary_day,emergency_target:target.value}); toast('تم حفظ هدف الطوارئ')}catch(e){toast(e.message,'bad')}}</script></body></html>
