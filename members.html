<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script><main class="container page"><h1>أفراد الأسرة والحسابات الفرعية</h1><section class="card"><div class="row"><div><label>الاسم</label><input id="mname"></div><div><label>الصلة</label><input id="relation"></div><div><label>المصروف الشهري</label><input id="allowance" type="number"></div><div><label>إيميل الحساب الفرعي اختياري</label><input id="subEmail" type="email"></div></div><button class="btn primary" onclick="addMember()">إضافة فرد</button><p class="muted">لربط حساب فرعي: خلي الفرد يسجل بنفس الإيميل، ثم اربطه يدويًا من Supabase أو طوّر دعوات لاحقًا.</p></section><section class="card" style="margin-top:14px"><table><thead><tr><th>الاسم</th><th>الصلة</th><th>المصروف</th><th>مرتبط بحساب</th></tr></thead><tbody id="list"></tbody></table></section></main><script>mountNav();let H;load();async function load(){H=await getHousehold(); if(!H) return; const {data}=await window.sb.from('household_members').select('*').eq('household_id',H.id).order('created_at',{ascending:false});list.innerHTML=(data||[]).map(m=>`<tr><td>${m.name}</td><td>${m.relation||'-'}</td><td>${fmt(m.monthly_allowance)}</td><td>${m.linked_user_id?'نعم':'لا'}</td></tr>`).join('')}async function addMember(){const {error}=await window.sb.from('household_members').insert({household_id:H.id,name:mname.value,relation:relation.value,monthly_allowance:allowance.value||0}); if(error) return alert(error.message); mname.value=relation.value=allowance.value=subEmail.value=''; load()}</script></body></html>
