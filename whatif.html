<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماذا لو؟</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script>
<main class="container page"><div class="page-head"><div><h1>محاكي ماذا لو؟</h1><p class="muted">جرب قراراتك قبل ما تعملها: زيادة دخل، تقليل مصروف، جمعية، شراء، هدف.</p></div><a class="btn secondary" href="dashboard.html">الرئيسية</a></div>
<section class="card top-line"><div class="what-grid"><div><label>زيادة دخل</label><input id="incomeDelta" type="number" value="0"></div><div><label>تقليل مصروف شهري</label><input id="expenseCut" type="number" value="0"></div><div><label>التزام جديد / جمعية</label><input id="newCommitment" type="number" value="0"></div><div><label>هدف عايز تحوشه</label><input id="target" type="number" value="0"></div></div><div class="actions"><button class="btn primary" onclick="runSim()">احسب السيناريو</button><button class="btn secondary" onclick="fillScenario('gam')">جمعية 1000</button><button class="btn secondary" onclick="fillScenario('cut')">تقليل 15%</button></div></section>
<section class="grid-2" style="margin-top:16px"><div class="card"><h3>النتيجة</h3><div id="result" class="result-box">اضغط احسب السيناريو.</div></div><div class="card"><h3>قرار المستشار</h3><div id="decision" class="result-box">—</div></div></section></main>
<script>mountNav();let H,S;load();async function load(){H=await getHousehold();S=await financeSummary(H)}function fillScenario(t){if(t==='gam')newCommitment.value=1000;if(t==='cut')expenseCut.value=Math.round(S.expenses*.15);runSim()}function runSim(){const r=simulateWhatIf(S,{incomeDelta:incomeDelta.value,expenseCut:expenseCut.value,newCommitment:newCommitment.value,target:target.value});result.textContent=`الدخل الجديد: ${fmt(r.newIncome)}\nالمصاريف بعد التخفيض: ${fmt(r.newExpenses)}\nالالتزامات الجديدة: ${fmt(r.newCommit)}\nالمتبقي المتوقع: ${fmt(r.remaining)}${Number(target.value)>0?`\nالوصول للهدف خلال: ${r.months} شهر تقريبًا`:''}`;decision.textContent=r.remaining<0?'القرار خطر: السيناريو يعمل عجز. قلل الالتزام أو زوّد المدة.':r.remaining<S.income*.1?'القرار ممكن لكن ضاغط. لازم تراقب الصرف الأسبوعي.':'القرار آمن نسبيًا ومناسب لو ملتزم بالخطة.'}</script></body></html>
