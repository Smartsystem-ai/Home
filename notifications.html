<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="js/config.js"></script><script src="js/app.js"></script><main class="container page"><h1>الإشعارات اليومية</h1><section class="card"><button class="btn primary" onclick="dailyCheck()">إنشاء ملخص اليوم الآن</button><table><tbody id="list"></tbody></table></section></main><script>mountNav();let H;load();async function load(){H=await getHousehold();const {data}=await window.sb.from('notifications').select('*').eq('household_id',H.id).order('created_at',{ascending:false});list.innerHTML=(data||[]).map(n=>`<tr><td><b>${n.title}</b><br><span class="muted">${n.body||''}</span></td><td>${new Date(n.created_at).toLocaleString('ar-EG')}</td></tr>`).join('')||'<tr><td>لا توجد إشعارات</td></tr>'}async function dailyCheck(){const today=new Date().toISOString().slice(0,10);const {data:bills}=await window.sb.from('bills').select('*').eq('household_id',H.id).neq('status','paid');const due=(bills||[]).filter(b=>b.due_date && b.due_date<=today);await addNotification(H.id,H.user.id,'ملخص اليوم',`عندك ${due.length} فواتير مستحقة أو متأخرة و ${bills.length} فواتير مفتوحة.`,'daily');load()}</script></body></html>
